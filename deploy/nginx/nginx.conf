# Main configuration for the unprivileged Nginx image (uid 101).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
# On SIGQUIT (graceful stop) wait at most this long for open connections,
# i.e. WebSockets, before closing them. Keep it below the container's
# stop_grace_period.
worker_shutdown_timeout 10s;

events {
    worker_connections 4096;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # One JSON line per request. $uri (no query string), no cookies, no
    # Authorization or other headers: nothing secret reaches the log.
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
