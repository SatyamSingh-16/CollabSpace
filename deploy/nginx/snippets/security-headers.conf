# Included in every location that sends a response: add_header in a location
# replaces all inherited add_header lines, so they can't live at server level.
#
# CSP matches the built frontend: one module script and one stylesheet from
# this origin, no inline scripts, API and WebSocket on this origin ('self'
# covers wss: to the same host in CSP Level 3 browsers; checked in Chromium).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Empty unless HSTS_MAX_AGE is set (only with a real, trusted certificate):
# Nginx sends no header when the value is empty.
add_header Strict-Transport-Security $hsts always;
