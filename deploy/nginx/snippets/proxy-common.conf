# Headers for requests forwarded to the Go server.
proxy_set_header Host $http_host;
# Nginx is the edge: $remote_addr is the TCP peer. X-Real-IP is OVERWRITTEN,
# never passed through, so a client can't choose its rate-limit identity.
# The app trusts this header only because it is reachable from Nginx alone
# (TRUSTED_PROXY_IP_HEADER=X-Real-IP; the app container publishes no port).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
